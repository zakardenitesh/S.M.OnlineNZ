/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function esc(value){
  if(value === undefined || value === null) return "";
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showMsg(id,text,type="ok"){
  const e=$(id);
  if(!e)return;
  e.className="msg show "+(type==="err"?"err":"ok");
  e.textContent=text;
}

function hideMsg(id){
  const e=$(id);
  if(e)e.className="msg";
}

function usernameEmail(username){
  return String(username).trim().toLowerCase()
    .replace(/\s+/g,"") + "@sm-online-nz.local";
}

function makeUsernameKey(username){
  return String(username).trim().toLowerCase();
}

function money(n){
  return "₹"+Number(n||0).toFixed(2);
}

function timeToMinutes(t){
  if(!t)return 0;
  const p=t.split(":").map(Number);
  return (p[0]*60)+(p[1]||0);
}

function nowMinutes(){
  const d=new Date();
  return d.getHours()*60+d.getMinutes();
}

function marketPhase(market){
  if(!market || market.enabled===false)return "disabled";

  const open=timeToMinutes(market.openTime);
  const close=timeToMinutes(market.closeTime);
  const now=nowMinutes();

  if(open<=close){
    if(now>=open && now<close)return "open";
  }else{
    if(now>=open || now<close)return "open";
  }

  return "closed";
}

function phaseText(market){
  const p=marketPhase(market);
  if(p==="open")return `<span class="open">OPEN</span>`;
  if(p==="disabled")return `<span class="closed">DISABLED</span>`;
  return `<span class="closed">CLOSED</span>`;
}

function defaultMarkets(){
  const arr=[];
  for(let i=1;i<=MARKET_COUNT;i++){
    arr.push({
      id:"market"+i,
      number:i,
      name:"Market "+i,
      boxText:"",
      openTime:"09:00",
      closeTime:"21:00",
      enabled:true
    });
  }
  return arr;
}

function normalizeMarkets(arr){
  const base=defaultMarkets();

  if(!Array.isArray(arr))return base;

  for(let i=0;i<Math.min(arr.length,MARKET_COUNT);i++){
    if(arr[i]){
      base[i]={
        ...base[i],
        ...arr[i],
        id:arr[i].id || base[i].id,
        number:i+1
      };
    }
  }

  return base;
}

        ...settingsData,
        ...snap.data()
      };
    }

    const mSnap=await getDoc(doc(db,"settings","markets"));

    if(mSnap.exists()){
      markets=normalizeMarkets(mSnap.data().markets);
    }else{
      markets=defaultMarkets();
    }

  }catch(err){
    console.error(err);
    markets=defaultMarkets();
  }
}

window.openUserLogin=function(){

  $("app").innerHTML=`

      <div class="title">User Login</div>

      <div class="card">

        <label>Username</label>
        <input id="loginUsername"
          autocomplete="username"
          placeholder="आपला Username">

        <label>Password</label>
        <input id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="आपला Password">

        <div id="loginMsg" class="msg"></div>

        <button class="btn full"
          onclick="doUserLogin()">
          Login
        </button>

        <button class="btn green full"
          onclick="openUserCreate()">
          User Create
        </button>

      </div>

      <div class="nav-buttons">
        <button class="btn gray"

        </button>

        <button class="btn"
          onclick="doUserLogin()">

        </button>
      </div>

    </div>
  `;
};


window.doUserLogin=async function(){

  const username=$("loginUsername")?.value.trim();
  const password=$("loginPassword")?.value;

  if(!username || !password){
    showMsg("loginMsg","Username आणि Password टाका.","err");
    return;
  }

  try{

    const key=makeUsernameKey(username);

    const uSnap=await getDoc(
      doc(db,"usernames",key)
    );

    if(!uSnap.exists()){
      showMsg("loginMsg","Username सापडला नाही.","err");
      return;
    }

    const data=uSnap.data();
    const email=usernameEmail(key);

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(err){

    console.error(err);

    showMsg(
      "loginMsg",
      "Username किंवा Password चुकीचा आहे.",
      "err"
    );
  }
};

        <div id="createMsg" class="msg"></div>

        <button class="btn green full"
          onclick="createUserAccount()">

        </button>

      </div>

      <div class="card small-text">
        Mobile Number फक्त Account मध्ये नोंदवला जाईल.
        Phone OTP वापरलेला नाही.
      </div>

      <div class="nav-buttons">

window.createUserAccount=async function(){

  const mobile=$("createMobile")?.value.trim();
  const username=$("createUsername")?.value.trim();
  const name=$("createName")?.value.trim();
  const password=$("createPassword")?.value;
  const confirm=$("createConfirm")?.value;

  if(!mobile || !username || !name || !password || !confirm){
    showMsg("createMsg","सर्व माहिती भरा.","err");
    return;
  }

  if(password.length<6){
    showMsg("createMsg","Password किमान 6 अक्षरांचा असावा.","err");
    return;
  }

  if(password!==confirm){
    showMsg("createMsg","दोन्ही Password सारखे नाहीत.","err");
    return;
  }

  const cleanUsername=makeUsernameKey(username);

  if(!/^[a-zA-Z0-9._-]{3,30}$/.test(cleanUsername)){
    showMsg(
      "createMsg",
      "Username मध्ये फक्त English अक्षरे, नंबर, dot, _ किंवा - वापरा.",
      "err"
    );
    return;
  }

  try{

    const existing=await getDoc(
      doc(db,"usernames",cleanUsername)
    );

    if(existing.exists()){
      showMsg(
        "createMsg",
        "हा Username आधीच वापरलेला आहे.",
        "err"
      );
      return;
    }

    /*
      Firebase Authentication मध्ये थेट नवीन email/password
      account browser-only client code मधून create करण्यासाठी
      createUserWithEmailAndPassword import आवश्यक आहे.
      त्यामुळे खाली dynamic import वापरला आहे.
    */

    const {createUserWithEmailAndPassword} =
      await import(
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js"
      );

    const email=usernameEmail(cleanUsername);

    const cred=await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    const uid=cred.user.uid;

    await setDoc(
      doc(db,"usernames",cleanUsername),
      {
        uid:uid,
        username:cleanUsername,
        name:name,
        createdAt:serverTimestamp()
      }
    );

    await setDoc(
      doc(db,"users",uid),
      {
        uid:uid,
        username:cleanUsername,
        name:name,
        mobile:mobile,
        wallet:0,
        createdAt:serverTimestamp()
      }
    );

    showMsg(
      "createMsg",
      "Account तयार झाले. पुढे जात आहोत...",
      "ok"
    );

    setTimeout(()=>{
      openUserPage2();
    },700);

  }catch(err){

    console.error(err);

    let message="Account तयार करता आले नाही.";

    if(err.code==="auth/email-already-in-use"){
      message="हा Username आधीच वापरलेला आहे.";
    }else if(err.code==="auth/invalid-email"){
      message="Username योग्य स्वरूपात टाका.";
    }else if(err.code==="auth/weak-password"){
      message="Password खूप छोटा आहे.";
    }

    showMsg("createMsg",message,"err");
  }
};

        <button class="btn gray"

        </button>

        <button class="btn dark"
          onclick="doAdminLogin()">

        </button>
      </div>

    </div>
  `;
};


window.doAdminLogin = async function(){

    const email = $("adminEmail")?.value.trim();
    const password = $("adminPassword")?.value;

    if(!email || !password){
        showMsg("adminLoginMsg","ईमेल आणि पासवर्ड टाका.","err");
        return;
    }

    try{

        const cred = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        console.log("Firebase Login Success");
        console.log("Logged UID:", cred.user.uid);
        console.log("Expected Admin UID:", ADMIN_UID);

        if(cred.user.uid !== ADMIN_UID){

            await signOut(auth);

            showMsg(
                "adminLoginMsg",
                "Firebase Login झाले, पण हा Admin UID नाही. UID: " + cred.user.uid,
                "err"
            );

            return;
        }

        showMsg(
            "adminLoginMsg",
            "Admin Login यशस्वी झाले! 👍",
            "ok"
        );

        setTimeout(() => {
            showPage(4);
        }, 500);

    }catch(err){

        console.error("ADMIN LOGIN ERROR:", err);

        showMsg(
            "adminLoginMsg",
            "Firebase Error: " + err.code + " — " + err.message,
            "err"
        );
    }
};

window.sendPasswordReset=async function(){

  const username=$("restoreUsername")?.value.trim();

  if(!username){
    showMsg("restoreMsg","Username टाका.","err");
    return;
  }

  try{

    const snap=await getDoc(
      doc(db,"usernames",makeUsernameKey(username))
    );

    if(!snap.exists()){
      showMsg("restoreMsg","Username सापडला नाही.","err");
      return;
    }

    const {sendPasswordResetEmail} =
      await import(
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js"
      );

    await sendPasswordResetEmail(
      auth,
      usernameEmail(makeUsernameKey(username))
    );

    showMsg(
      "restoreMsg",
      "Password Reset Link पाठवला आहे.",
      "ok"
    );

  }catch(err){
    console.error(err);
    showMsg(
      "restoreMsg",
      "Reset Link पाठवता आला नाही.",
      "err"
    );
  }
};

async function getMarketCategories(marketId,page){

  const session="open";

  const exactId=
    `${marketId}_${session}_page${page}`;

  const exact=await getDoc(
    doc(db,"marketPages",exactId)
  );

  if(exact.exists()){
    return exact.data();
  }

  const oldId=`${marketId}_page${page}`;

  const old=await getDoc(
    doc(db,"marketPages",oldId)
  );

  if(old.exists()){
    return old.data();
  }

  return {
    categories:[]
  };
}


async function loadMarketPageContent(){

  const area=$("marketPageContent");

  if(!area)return;

  if(marketPhase(currentMarket)!=="open"){

    area.innerHTML=`
      <div class="center">
        <h3>Market Closed</h3>
        <p>
          या Market ची वेळ संपलेली आहे.

    `;

    return;
  }

  try{

    const data=await getMarketCategories(
      currentMarket.id,
      currentMarketPage
    );

    let categories=Array.isArray(data.categories)
      ? data.categories
      : [];

    if(categories.length===0){

      area.innerHTML=`

          या Page वर सध्या कोणतीही Category उपलब्ध नाही.

      `;

    }

    area.innerHTML=`

        Page ${currentMarketPage}
      </h3>

      ${
        categories.map((cat,index)=>{

          let name="";

          if(typeof cat==="string"){
            name=cat;
            price=0;
          }else{
            name=cat.name || "";
            price=Number(cat.price||0);
          }

          return `

            <div class="category">

              <div class="category-row">

                <div class="category-name">
                  ${esc(name)}
                </div>

                ${
                  price>0
                  ? `<div class="category-price">${money(price)}</div>`
                  : ""
                }

              </div>

              <button class="btn green full"
                onclick="payCategory(
                  '${esc(currentMarket.id)}',
                  ${currentMarketPage},
                  ${index},
                  '${esc(name)}',
                  ${price}
                )">
                Pay
              </button>

            </div>
          `;

        }).join("")
      }

    `;

  }catch(err){

    console.error(err);

    area.innerHTML=`
      <div class="msg show err">
        Categories load झाल्या नाहीत.
      </div>
    `;
  }
}


/* =========================================================
   CATEGORY PAYMENT
========================================================= */

window.payCategory=async function(
  marketId,
  page,
  index,
  categoryName,
  price
){

  price=Number(price||0);

  if(price<PAYMENT_MIN){
    alert(`Payment minimum ${money(PAYMENT_MIN)} आहे.`);
    return;
  }

  const ok=confirm(
    `${categoryName} साठी ${money(price)} Pay करायचे?`
  );

  if(!ok)return;

  try{

    await runTransaction(db,async(transaction)=>{

      const userRef=doc(
        db,
        "users",
        currentUser.uid
      );

      const userSnap=await transaction.get(userRef);

      if(!userSnap.exists()){
        throw new Error("USER_NOT_FOUND");
      }

      const data=userSnap.data();
      const before=Number(data.wallet||0);

      if(before<price){
        throw new Error("LOW_BALANCE");
      }

      const after=before-price;

      transaction.update(
        userRef,
        {
          wallet:after
        }
      );

      const paymentRef=doc(
        collection(db,"payments")
      );

      transaction.set(
        paymentRef,
        {
          uid:currentUser.uid,
          username:data.username||"",
          name:data.name||"",
          marketId:marketId,
          marketName:currentMarket?.name||"",
          marketNumber:currentMarket?.number||0,
          session:"open",
          page:page,
          category:categoryName,
          amount:price,
          walletBefore:before,
          walletAfter:after,
          status:"paid",
          createdAt:serverTimestamp()
        }
      );

    });

    await refreshUserData();

    alert(
      `${money(price)} Payment झाला.\nWallet Balance: ${money(currentUserData.wallet)}`
    );

    await renderMarketPage();

  }catch(err){

    console.error(err);

    if(err.message==="LOW_BALANCE"){
      alert("Demo Wallet मध्ये पुरेशी रक्कम नाही.");
    }else{
      alert("Payment करता आले नाही.");
    }
  }
};

window.loadHistoryType=async function(type){

  const area=$("historyArea");

  if(!area)return;

  area.innerHTML="Loading...";

  try{

    if(type==="payments" ||
       type==="categories" ||
       type==="selected"){

      const snap=await getDocs(
        query(
          collection(db,"payments"),
          where("uid","==",currentUser.uid)
        )
      );

      let arr=snap.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      arr.sort(
        (a,b)=>
          (b.createdAt?.seconds||0)-
          (a.createdAt?.seconds||0)
      );

      area.innerHTML=`
        <h3>${esc(
          type==="payments"
          ? "Payment History"
          : type==="categories"
          ? "Categories History"
          : "Selected Categories History"
        )}</h3>

        ${
          arr.length
          ? arr.map(x=>`

              <div class="list-item">

                <b>${esc(x.category||"-")}</b>

                <div>
                  ${esc(x.marketName||"")}
                  - Page ${esc(x.page||"")}
                </div>

                <div>
                  Amount:
                  <b>${money(x.amount)}</b>
                </div>

                <div>
                  Wallet:
                  ${money(x.walletBefore)}
                  →
                  ${money(x.walletAfter)}
                </div>

                <span class="status paid">
                  Paid
                </span>

              </div>

            `).join("")
          : `<div class="small-text">History नाही.</div>`
        }
      `;

      return;
    }

    const snap=await getDocs(
      query(
        collection(db,"walletRequests"),
        where("uid","==",currentUser.uid)
      )
    );

    let arr=snap.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    if(type==="recharge"){
      arr=arr.filter(x=>x.type==="recharge");
    }

    if(type==="withdrawal"){
      arr=arr.filter(x=>x.type==="withdrawal");
    }

    arr.sort(
      (a,b)=>
        (b.createdAt?.seconds||0)-
        (a.createdAt?.seconds||0)
    );

    area.innerHTML=`

      <h3>
        ${type==="recharge"
          ?"Recharge History"
          :"Withdrawal History"}
      </h3>

      ${
        arr.length
        ? arr.map(x=>`

            <div class="list-item">

              <b>
                ${x.type==="recharge"
                  ?"Recharge"
                  :"Withdrawal"}
              </b>

              <div>
                Amount:
                <b>${money(x.amount)}</b>
              </div>

              ${
                x.transactionId
                ? `<div>UTR: ${esc(x.transactionId)}</div>`
                :""
              }

              ${
                x.upi
                ? `<div>UPI: ${esc(x.upi)}</div>`
                :""
              }

              <div style="margin-top:6px">
                <span class="status ${esc(x.status||"pending")}">
                  ${esc(x.status||"pending")}
                </span>
              </div>

            </div>

          `).join("")
        : `<div class="small-text">History नाही.</div>`
      }
    `;

  }catch(err){

    console.error(err);

    area.innerHTML=`
      <div class="msg show err">
        History load करता आली नाही.
      </div>
    `;
  }
};

function fileToDataURL(file){

  return new Promise((resolve,reject)=>{

    if(!file){
      resolve("");
      return;
    }

    const reader=new FileReader();

    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}

async function buildCategoryEditors(marketId){

  const area=$("categoryEditorArea");

  const pages=[];

  for(let p=1;p<=4;p++){

    const data=await getMarketCategories(
      marketId,
      p
    );

    let cats=Array.isArray(data.categories)
      ? data.categories
      : [];

    cats=cats.map(c=>{
      if(typeof c==="string"){
        return {
          name:c,
          price:PAYMENT_MIN
        };
      }
      return {
        name:c.name||"",
        price:Number(c.price||PAYMENT_MIN)
      };
    });

    pages.push({
      page:p,
      categories:cats
    });
  }

  area.innerHTML=pages.map(x=>`

    <div class="card">

      <h3>Page ${x.page}</h3>

      <div id="cat_page_${x.page}">

                value="${esc(c.name)}"

              <input
                class="cat-price-${x.page}"
                data-index="${i}"
                type="number"
                min="${PAYMENT_MIN}"
                value="${Number(c.price||PAYMENT_MIN)}">

            </div>

          `).join("")
        }

        onclick="addCategoryRow(${x.page})">

window.saveCategoryPages=async function(marketId){

  try{

    const market=markets.find(x=>x.id===marketId);

    if(!market)return;

    for(let p=1;p<=4;p++){

      const names=[
        ...document.querySelectorAll(
          `.cat-name-${p}`
        )
      ];

      const prices=[
        ...document.querySelectorAll(
          `.cat-price-${p}`
        )
      ];

      const categories=[];

      for(let i=0;i<names.length;i++){

        const name=names[i].value.trim();

        if(!name)continue;

        let price=Number(
          prices[i]?.value || PAYMENT_MIN
        );

        if(price<PAYMENT_MIN){
          price=PAYMENT_MIN;
        }

        categories.push({
          name:name,
          price:price
        });
      }

      const id=
        `${marketId}_open_page${p}`;

      await setDoc(
        doc(db,"marketPages",id),
        {
          marketId:marketId,
          marketName:market.name,
          session:"open",
          page:p,
          categories:categories,
          updatedAt:serverTimestamp(),
          updatedBy:currentUser.uid
        }
      );
    }

    alert("चारही Pages च्या Categories Save झाल्या.");

/* =========================================================
   APPROVE
========================================================= */

window.approveRequest=async function(requestId){

  const ok=confirm(
    "ही Request Approve करायची आहे का?"
  );

  if(!ok)return;

  try{

    await runTransaction(db,async(transaction)=>{

      const reqRef=doc(
        db,
        "walletRequests",
        requestId
      );

      const reqSnap=await transaction.get(reqRef);

      if(!reqSnap.exists()){
        throw new Error("REQUEST_NOT_FOUND");
      }

      const req=reqSnap.data();

      if(req.status!=="pending"){
        throw new Error("ALREADY_DONE");
      }

      const userRef=doc(
        db,
        "users",
        req.uid
      );

      const userSnap=await transaction.get(userRef);

      if(!userSnap.exists()){
        throw new Error("USER_NOT_FOUND");
      }

      const user=userSnap.data();
      const before=Number(user.wallet||0);
      const amount=Number(req.amount||0);

      let after=before;

      if(req.type==="recharge"){

        after=before+amount;

      }else if(req.type==="withdrawal"){

        if(before<amount){
          throw new Error("LOW_BALANCE");
        }

        after=before-amount;
      }

      transaction.update(
        userRef,
        {
          wallet:after
        }
      );

      transaction.update(
        reqRef,
        {
          status:"approved",
          approvedAt:serverTimestamp(),
          approvedBy:currentUser.uid,
          walletBefore:before,
          walletAfter:after
        }
      );

    });

    alert("Request Approved.");

    showAdminSection(adminSection);

  }catch(err){

    console.error(err);

    if(err.message==="LOW_BALANCE"){
      alert("User Wallet मध्ये पुरेशी रक्कम नाही.");
    }else if(err.message==="ALREADY_DONE"){
      alert("ही Request आधीच Process झाली आहे.");
    }else{
      alert("Request Approve करता आली नाही.");
    }
  }
};

window.sendAdminNotification=async function(){

  const title=$("notTitle")?.value.trim();
  const message=$("notMessage")?.value.trim();
  const target=$("notTarget")?.value;
  const uid=$("notUID")?.value.trim();

  if(!title || !message){
    showMsg(
      "notMsg",
      "Title आणि Message भरा.",
      "err"
    );
    return;
  }

  if(target==="user" && !uid){
    showMsg(
      "notMsg",
      "Specific User UID टाका.",
      "err"
    );
    return;
  }

  try{

    await addDoc(
      collection(db,"notifications"),
      {
        title:title,
        message:message,
        target:target,
        uid:target==="user"?uid:null,
        createdAt:serverTimestamp(),
        createdBy:currentUser.uid
      }
    );

    showMsg(
      "notMsg",
      "Notification पाठवली आहे.",
      "ok"
    );

    $("notTitle").value="";
    $("notMessage").value="";
    $("notUID").value="";

  }catch(err){

    console.error(err);

    showMsg(
      "notMsg",
      "Notification पाठवता आली नाही.",
      "err"
    );
  }
};


/* =========================================================
   USER NOTIFICATIONS
========================================================= */

window.openNotifications=async function(){

  $("app").innerHTML=`

    <div class="page">

      <div class="title">
        Notifications
      </div>

      <div id="notificationList">
        Loading...
      </div>

      <div class="nav-buttons">

        <button class="btn gray"
          onclick="openUserPage2()">
          ← Back
        </button>

        <button class="btn"
          onclick="openUserPage3()">
          Next →
        </button>

      </div>

    </div>
  `;

  try{

    const snap=await getDocs(
      collection(db,"notifications")
    );

    let arr=snap.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    arr=arr.filter(n=>
      n.target==="all" ||
      (n.target==="user" && n.uid===currentUser.uid)
    );

    arr.sort(
      (a,b)=>
        (b.createdAt?.seconds||0)-
        (a.createdAt?.seconds||0)
    );

    $("notificationList").innerHTML=
      arr.length
      ? arr.map(n=>`

        <div class="list-item">

          <b>${esc(n.title||"Notification")}</b>

          <div style="margin-top:7px">
            ${esc(n.message||"")}
          </div>

        </div>

      `).join("")
      : `
        <div class="card center">
          Notification नाही.
        </div>
      `;

  }catch(err){

    console.error(err);

    $("notificationList").innerHTML=`
      <div class="msg show err">
        Notifications load झाल्या नाहीत.
      </div>
    `;
  }
};


/* =========================================================
   LOGOUT
========================================================= */

window.logout=async function(){

  try{
    await signOut(auth);
  }catch(err){
    console.error(err);
  }
};


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(auth,async(user)=>{

  currentUser=user;

  if(!user){

    currentUserData=null;
    isAdmin=false;

    await loadSettings();
    renderHome();

    return;
  }

  isAdmin=user.uid===ADMIN_UID;

  await refreshUserData();
  await loadSettings();

  if(isAdmin){

    openAdminDashboard();

  }else{

    openUserPage2();

  }

});


/* =========================================================
   START
========================================================= */

await loadSettings();

if(!auth.currentUser){
  renderHome();
}

</script>
