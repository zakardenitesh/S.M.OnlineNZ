<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SM.OnlineNZ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f4f7;color:#18202a}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:900px;margin:auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0001}
h1,h2,h3{margin:8px 0}
.center{text-align:center}
.muted{color:#667085}
.topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:#fff;padding:10px;border-radius:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
input,select{width:100%;padding:12px;border:1px solid #ccd3dd;border-radius:9px;background:#fff}
.btn{border:0;border-radius:9px;padding:11px 14px;background:#1f6feb;color:white;font-weight:700}
.btn2{background:#667085}
.green{background:#168a4a}
.red{background:#c62828}
.orange{background:#d97706}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.market{padding:18px 8px;border:0;border-radius:12px;background:#fff;box-shadow:0 2px 8px #0001;font-weight:700}
.pageTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{padding:10px 5px;border:0;border-radius:9px;background:#e7ebf0}
.tab.active{background:#1f6feb;color:#fff}
.catGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.cat{padding:15px;border:0;border-radius:11px;background:#f8fafc;box-shadow:0 1px 5px #0002;text-align:left}
.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef2ff;font-size:12px}
.success{color:#137333}
.danger{color:#b42318}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
img.app-photo{width:100%;height:auto;max-height:280px;object-fit:contain;border-radius:12px;background:#eee}
.notice{padding:10px;border-radius:9px;background:#fff7d6}
.err{padding:10px;border-radius:9px;background:#fee4e2;color:#9b1c1c}
.ok{padding:10px;border-radius:9px;background:#dcfce7;color:#166534}
.small{font-size:12px}
.amount{font-size:24px;font-weight:800}
.hero{padding:22px;text-align:center;background:linear-gradient(135deg,#ffffff,#eef5ff);border-radius:18px;box-shadow:0 3px 14px #0001}
.hero h1{font-size:30px}
.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.admin-box{border:1px solid #e1e7ef;border-radius:12px;padding:12px;background:#fafcff}
.danger-btn{background:#b42318;color:#fff;border:0;border-radius:8px;padding:8px 10px}

@media(max-width:600px){
.wrap{padding:7px}
.grid{grid-template-columns:1fr}
.pageTabs{grid-template-columns:repeat(4,1fr);font-size:12px}
.catGrid{grid-template-columns:1fr}
.admin-grid{grid-template-columns:1fr}
table{font-size:11px}
}
</style>
</head>

<body>

<div class="wrap">
<div id="app"></div>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signInWithEmailAndPassword,
signOut,
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
addDoc,
updateDoc,
deleteDoc,
collection,
getDocs,
query,
where,
orderBy,
serverTimestamp,
runTransaction
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyCNptG-KjGXiZC8m3aRqDRpLUsFczJIhlU",
authDomain:"sm-online-nz.firebaseapp.com",
projectId:"sm-online-nz",
storageBucket:"sm-online-nz.firebasestorage.app",
messagingSenderId:"926453668307",
appId:"1:926453668307:web:eea1694724c0c2e73db726",
measurementId:"G-81B2SYWD23"
};

const appFB=initializeApp(firebaseConfig);
const auth=getAuth(appFB);
const db=getFirestore(appFB);

const ADMIN_UID="gOmc0VeiakVc6aKikc7Km2uw1Du2";

const MIN_RECHARGE=200;
const MIN_PAYMENT=5;
const MARKET_COUNT=16;
const PAGE_COUNT=4;

let me=null;
let isAdmin=false;
let settings={};
let markets=[];
let selectedMarket=null;
let selectedPage=1;

/* IMPORTANT:
   Firebase ची पहिली auth state येईपर्यंत
   Admin Login box आपोआप बंद होऊ नये.
*/
let authReady=false;


const $=id=>document.getElementById(id);

const esc=s=>String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

function msg(text,type="notice"){
return `<div class="${type}">${esc(text)}</div>`;
}

function money(n){
return "₹"+Number(n||0).toFixed(2);
}

function now(){
return new Date();
}

function timeToMin(t){
if(!t)return null;
const [h,m]=t.split(":").map(Number);
return h*60+m;
}

function marketOpen(m){

const o=timeToMin(m.openTime);
const c=timeToMin(m.closeTime);

if(o===null||c===null)return true;

const x=
now().getHours()*60+
now().getMinutes();

return o<=c
?x>=o&&x<c
:x>=o||x<c;
}


/* ================= SETTINGS ================= */

async function getSettings(){

const s=
await getDoc(
doc(db,"settings","main")
);

settings=
s.exists()
?s.data()
:{};

}


/* ================= MARKETS ================= */

async function getMarkets(){

const snap=
await getDocs(
collection(db,"markets")
);

markets=
snap.docs
.map(d=>({
id:d.id,
...d.data()
}))
.sort(
(a,b)=>
(a.number||0)-
(b.number||0)
);

if(!markets.length){

for(let i=1;i<=MARKET_COUNT;i++){

await setDoc(
doc(db,"markets","market"+i),
{
number:i,
name:"Market "+i,
openTime:"09:00",
closeTime:"21:00",
enabled:true,
updatedAt:serverTimestamp()
}
);

}

const s=
await getDocs(
collection(db,"markets")
);

markets=
s.docs
.map(d=>({
id:d.id,
...d.data()
}))
.sort(
(a,b)=>
a.number-b.number
);

}

}


/* ================= USER DOC ================= */

async function getUserDoc(){

if(!me)return null;

const s=
await getDoc(
doc(db,"users",me.uid)
);

return s.exists()
?s.data()
:null;

}


/* ================= HOME ================= */

const photo=
settings.appPhoto||"";

return `
<div class="hero">

${photo
?`<img
class="app-photo"
src="${esc(photo)}"
alt="App Photo">`
:""}

${esc(settings.appName||"SM.OnlineNZ")}
</h1>

${esc(settings.info||"")}

<div class="row">

class="btn"
onclick="showUserLogin()">

function render(){

$("app").innerHTML=

}


/* ================= USER LOGIN BOX ================= */

window.showUserLogin=()=>{

$("authBox").innerHTML=`

id="loginEmail"
placeholder="Username">

id="loginPass"

/* ================= ADMIN LOGIN BOX ================= */

window.showAdminLogin=()=>{

$("authBox").innerHTML=`

<div class="card">

<h2>Admin Login</h2>

<input
id="adminEmail"
type="email"
placeholder="Admin Email">

<br><br>

<input
id="adminPass"
type="password"
placeholder="Password">

<br><br>

<button
class="btn orange"
onclick="adminLogin()">
Admin Login
</button>

<button
class="btn btn2"
onclick="render()">
Close
</button>

<div id="authMsg"></div>

</div>

`;

};


/* ================= USER LOGIN ================= */

window.userLogin=async()=>{

try{

const u=
$("loginEmail")
.value
.trim();

const p=
$("loginPass")
.value;

if(!u||!p)
throw Error(
"Username आणि Password भरा."
);

const us=
await getDocs(
query(
collection(db,"usernames"),
where("username","==",u)
)
);

if(us.empty)
throw Error(
"Username सापडले नाही."
);

const data=
us.docs[0].data();

const cred=
await signInWithEmailAndPassword(
auth,
data.loginEmail,
p
);

await finishLogin(
cred.user
);

}catch(e){

$("authMsg").innerHTML=
msg(
e.message||
"Login failed",
"err"
);

}

};


/* ================= ADMIN LOGIN ================= */

window.adminLogin=async()=>{

try{

const e=
$("adminEmail")
.value
.trim();

const p=
$("adminPass")
.value;

const cred=
await signInWithEmailAndPassword(
auth,
e,
p
);

if(
cred.user.uid!==ADMIN_UID
){

await signOut(auth);

throw Error(
"हे Admin Account नाही."
);

}

await finishLogin(
cred.user
);

}catch(e){

$("authMsg").innerHTML=
msg(
e.message||
"Admin Login failed",
"err"
);

}

};


/* ================= USER CREATE ================= */
/*
   OTP नाही.
   Mobile Number + Username + Password.
*/

window.showUserCreate=()=>{

$("authBox").innerHTML=`

<div class="card">

<h2>User Create</h2>

<input
id="newPhone"
placeholder="Mobile Number"
inputmode="tel">

<br><br>

<input
id="newUsername"
placeholder="Username">

<br><br>

<input
id="newPassword"
type="password"
placeholder="Password (किमान 6)">

<br><br>

<input
id="newPassword2"
type="password"
placeholder="Confirm Password">

<br><br>

<button
class="btn green"
onclick="finishUserCreate()">
Create Account
</button>

<button
class="btn btn2"
onclick="render()">
Close
</button>

<div id="authMsg"></div>

</div>

`;

};


window.finishUserCreate=async()=>{

try{

const phone=
$("newPhone")
.value
.trim();

const username=
$("newUsername")
.value
.trim()
.toLowerCase();

const pass=
$("newPassword")
.value;

const pass2=
$("newPassword2")
.value;


if(!phone)
throw Error(
"Mobile Number टाका."
);


if(
!/^[a-z0-9_.-]{3,30}$/.test(username)
)
throw Error(
"Username 3-30 characters: a-z, 0-9, _, ., -"
);


if(pass.length<6)
throw Error(
"Password किमान 6 characters असावा."
);


if(pass!==pass2)
throw Error(
"Password आणि Confirm Password सारखे असले पाहिजेत."
);


const existing=
await getDoc(
doc(db,"usernames",username)
);


if(existing.exists())
throw Error(
"हा Username आधीच वापरला आहे."
);


const loginEmail=
username+
"@sm-online-nz.firebaseapp.com";


const credential=
await createUserWithEmailAndPassword(
auth,
loginEmail,
pass
);


await setDoc(
doc(
db,
"usernames",
username
),
{
uid:credential.user.uid,
username,
loginEmail,
createdAt:serverTimestamp()
}
);


await setDoc(
doc(
db,
"users",
credential.user.uid
),
{
uid:credential.user.uid,
username,
phone,
wallet:0,
role:"user",
createdAt:serverTimestamp(),
updatedAt:serverTimestamp()
}
);


me=
credential.user;

isAdmin=false;

await getSettings();
await getMarkets();

await dashboard();


}catch(e){

$("authMsg").innerHTML=
msg(
e.message||
"Create failed",
"err"
);

}

};


/* ================= FINISH LOGIN ================= */

async function finishLogin(u){

me=u;

isAdmin=
u.uid===ADMIN_UID;

await getSettings();
await getMarkets();

if(isAdmin){

showAdmin();

}else{

dashboard();

}

}


/* ================= USER DASHBOARD ================= */

const u=
await getUserDoc();

if(!u){

return;

}


$("app").innerHTML=`

<div class="topbar">

<b>
${esc(

<div class="row">

${

</div>


<div class="card">

<h3>16 Markets</h3>

<div class="grid">

${

<button

)}

}

</div>

</div>


<div class="card row">

<button
class="btn btn2"
onclick="showHistory('recharge')">
Recharge History
</button>

<button
class="btn btn2"
onclick="showHistory('payment')">
Payment History
</button>

<button
class="btn btn2"
onclick="showHistory('withdrawal')">
Withdrawal History
</button>

<button
class="btn red"
onclick="logout()">

</button>

/* ================= MARKET ================= */

window.openMarket=async id=>{

selectedMarket=
markets.find(
x=>x.id===id
);

selectedPage=1;

await renderMarket();

};


async function getCats(m,p){

const d=
await getDoc(
doc(
db,
"marketPages",
m.id+"_page"+p
)
);

return d.exists()
?(d.data().categories||[])
:[];

}


async function renderMarket(){

const m=
selectedMarket;

const open=
marketOpen(m);

const u=
await getUserDoc();

let cats=
await getCats(
m,
selectedPage
);


$("app").innerHTML=`

<div class="topbar">

<button
class="btn btn2"
onclick="dashboard()">
← Back
</button>

<b>
${esc(m.name)}
</b>

<span>
${open
?"🟢 Open"
:"🔴 Closed"}
</span>

</div>


<div class="card">

<h2>
${esc(m.name)}
</h2>

<p>
Time:
${esc(m.openTime||"")}
-
${esc(m.closeTime||"")}
</p>


<div class="pageTabs">

${[1,2,3,4]
.map(p=>`

<button
class="tab ${
p===selectedPage
?"active"
:""
}"
onclick="selectMarketPage(${p})">

Page ${p}

</button>

`)
.join("")}

</div>

</div>


<div class="card">

${
!open
?
msg(
"Market सध्या बंद आहे. Categories आणि Payment उपलब्ध नाही.",
"notice"
)
:
cats.length
?
`
<div class="catGrid">

${
cats
.map(
(c,i)=>`

<button
class="cat"
onclick="payCategory(${i})">

<b>
${esc(
c.name||
"Category "+(i+1)
)}
</b>

<br>

${money(c.amount||0)}

<br>

<span class="small">
${esc(c.note||"")}
</span>

</button>

`
)
.join("")
}

</div>
`
:
msg(
"या Page वर अजून Category नाही.",
"notice"
)

}

</div>


<div class="card">

<b>
Wallet:
${money(u?.wallet)}
</b>

<div
class="row"
style="margin-top:12px">

<button
class="btn btn2"
onclick="marketPrev()">
← Previous
</button>

<button
class="btn"
onclick="marketNext()">
Next →
</button>

</div>

</div>

`;

window._cats=
cats;

}


window.selectMarketPage=
async p=>{

selectedPage=p;

await renderMarket();

};


window.marketPrev=
async()=>{

if(selectedPage>1){

selectedPage--;

await renderMarket();

}

};


window.marketNext=
async()=>{

if(selectedPage<4){

selectedPage++;

await renderMarket();

}

};


/* ================= PAYMENT ================= */

window.payCategory=async i=>{

if(!marketOpen(selectedMarket)){

alert(
"Market बंद आहे."
);

return;

}

const c=
window._cats[i];

const amount=
Number(c.amount||0);

if(amount<MIN_PAYMENT){

alert(
"Minimum payment ₹5 आहे."
);

return;

}

const u=
await getUserDoc();

if(
Number(u?.wallet||0)
<
amount
){

alert(
"Wallet balance कमी आहे."
);

return;

}


try{

await runTransaction(
db,
async tx=>{

const ud=
doc(
db,
"users",
me.uid
);

const us=
await tx.get(ud);

if(!us.exists())
throw Error(
"User missing"
);

const current=
Number(
us.data().wallet||0
);

if(current<amount)
throw Error(
"Wallet balance कमी आहे."
);

tx.update(
ud,
{
wallet:current-amount,
updatedAt:serverTimestamp()
}
);


const pd=
doc(
collection(db,"payments")
);

tx.set(
pd,
{
userId:me.uid,
username:u.username||"",
marketId:selectedMarket.id,
marketName:selectedMarket.name||"",
page:selectedPage,
category:c.name||"",
amount,
type:"MarketPay",
status:"Paid",
createdAt:serverTimestamp()
}
);

}

);

alert(
"Payment यशस्वी. Wallet मधून "+
money(amount)+
" वजा झाले."
);

await renderMarket();

}catch(e){

alert(
e.message||
"Payment failed"
);

}

};

$("app").innerHTML=`

<button

<input

<div class="card">

Current Wallet:
</b>

${money(u?.wallet)}

`;

};


window.submitRecharge=async()=>{

try{

const amount=
Number(
$("rchAmount").value
);

const ref=
$("rchRef").value.trim();

if(amount<MIN_RECHARGE)
throw Error(
"Minimum Recharge ₹200 आहे."
);


const u=
await getUserDoc();


await addDoc(
collection(db,"walletRequests"),
{
userId:me.uid,
username:u.username||"",
amount,
type:"Recharge",
status:"Pending",
reference:ref,
createdAt:serverTimestamp()
}
);


$("pageMsg").innerHTML=
msg(
"Recharge Request तयार झाली. Admin approval नंतर Demo Wallet मध्ये credit होईल.",
"ok"
);


}catch(e){

$("pageMsg").innerHTML=
msg(
e.message||
"Recharge failed",
"err"
);

}

};

const u=
await getUserDoc();

$("app").innerHTML=`

<div class="card">

<button
class="btn btn2"
onclick="dashboard()">
← Back
</button>

<h2>
Withdrawal
</h2>

<p>

</p>

<p>

<input

window.submitWithdrawal=async()=>{

try{

const amount=
Number(
$("wdAmount").value
);

const upi=
$("wdUpi").value.trim();

const u=
await getUserDoc();


if(amount<500)
throw Error(
"Minimum Withdrawal ₹500 आहे."
);


if(
amount>
Number(u.wallet||0)
)
throw Error(
"Wallet balance कमी आहे."
);


if(!upi)
throw Error(
"UPI ID टाका."
);


await addDoc(
collection(db,"walletRequests"),
{
userId:me.uid,
username:u.username||"",
amount,
type:"Withdrawal",
status:"Pending",
upi,
createdAt:serverTimestamp()
}
);


$("pageMsg").innerHTML=
msg(
"Withdrawal Request तयार झाली.",
"ok"
);


}catch(e){

$("pageMsg").innerHTML=
msg(
e.message||
"Withdrawal failed",
"err"
);

}

};


/* ================= HISTORY ================= */

window.showHistory=async type=>{

await getUserDoc();

collection(
db,
type==="payment"
?"payments"
:"walletRequests"
),
where(

"==",
me.uid
),
orderBy(
"createdAt",
"desc"
)
);

await getDocs(q);

.map(d=>d.data())
.filter(
x=>

/* ================= SAVE CATEGORIES ================= */

window.saveCats=async(id,p)=>{

const lines=
$("cats_"+p)
.value
.split("\n")
.map(x=>x.trim())
.filter(Boolean);


const categories=
lines
.map(
line=>{

const a=
line.split("|");

return {

name:
(a[0]||"Category")
.trim(),

amount:
Number(
(a[1]||0)
.trim()
),

note:
(a[2]||"")
.trim()

};

}
)
.filter(
x=>
x.name&&
x.amount>=MIN_PAYMENT
);


await setDoc(
doc(
db,
"marketPages",
id+"_page"+p
),
{
marketId:id,
page:p,
categories,
updatedAt:serverTimestamp()
},
{
merge:true
}
);


alert(
"Page "+p+" saved."
);

};

/* ================= APPROVE ================= */

window.approveReq=async id=>{

try{

await runTransaction(
db,
async tx=>{

const rd=
doc(
db,
"walletRequests",
id
);

const rs=
await tx.get(rd);

if(!rs.exists())
throw Error(
"Request missing"
);

const r=
rs.data();

if(r.status!=="Pending")
throw Error(
"Already processed"
);


if(r.type==="Recharge"){

const ud=
doc(
db,
"users",
r.userId
);

const us=
await tx.get(ud);

if(!us.exists())
throw Error(
"User missing"
);

tx.update(
ud,
{
wallet:
Number(
us.data().wallet||0
)+
Number(r.amount),

updatedAt:
serverTimestamp()
}
);

}


else if(r.type==="Withdrawal"){

const ud=
doc(
db,
"users",
r.userId
);

const us=
await tx.get(ud);

if(!us.exists())
throw Error(
"User missing"
);

const bal=
Number(
us.data().wallet||0
);

const amt=
Number(r.amount);

if(bal<amt)
throw Error(
"Wallet balance कमी आहे."
);

tx.update(
ud,
{
wallet:
bal-amt,

updatedAt:
serverTimestamp()
}
);

}


tx.update(
rd,
{
status:"Approved",
approvedBy:ADMIN_UID,
approvedAt:serverTimestamp()
}
);

}
);


await loadAdminRequests();

alert(
"Approved."
);


}catch(e){

alert(
e.message||
"Approval failed"
);

}

};

/* ================= LOGOUT ================= */

window.logout=async()=>{

await signOut(auth);

me=null;
isAdmin=false;

render();

};


/* ================= AUTH STATE ================= */
/*
   हा मुख्य Admin Login Fix आहे.
   Firebase ची पहिली null state आली म्हणून
   Admin Login box पुन्हा बंद होणार नाही.
*/

onAuthStateChanged(
auth,
async u=>{

if(!u){

me=null;
isAdmin=false;

if(!authReady){

authReady=true;

return;

}

render();

return;

}


authReady=true;

me=u;

isAdmin=
u.uid===ADMIN_UID;


try{

await getSettings();
await getMarkets();

if(isAdmin){

showAdmin();

}else{

dashboard();

}

}catch(e){

render();

}

});


/* ================= START ================= */

render();
